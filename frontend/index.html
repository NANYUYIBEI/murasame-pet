<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Murasame Pet</title>
    <!-- 关键：确保这一行存在，用于加载 Live2D 核心库 -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- 主 CSS 文件 (Wails/Vite 会处理) -->
    <link href="/src/style.css" rel="stylesheet"/>
    <style>
        /* 基础样式确保 canvas 可见且窗口透明 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
        }
        #live2d-canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <!-- Live2D 渲染的 Canvas -->
    <canvas id="live2d-canvas"></canvas>
    <script>window.Live2D = {};</script>
    <!-- 主逻辑 JS (Wails/Vite 会处理) -->
    <script src="/src/main.js" type="module"></script>
</body>
</html>
